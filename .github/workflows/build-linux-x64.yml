name: Build Linux x86_64 (own-network starvation fix)

# Minimal build of easytier-core / easytier-cli for x86_64 Linux (static musl),
# used to test the fix on a public node without running the full core.yml matrix.
#
# This fork only allows actions from repositories it owns, so the job uses no
# `uses:` steps at all: plain git, apt, rustup and the runner's gh CLI. The
# binaries are published as a pre-release named build-<short sha>.
on:
  workflow_dispatch:
  push:
    branches: [ "fix/own-network-starvation" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl
  PROTOC_VERSION: "35.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        run: |
          git init -q src
          cd src
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format='%h %s'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qqy build-essential mold musl-tools unzip
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          protoc --version

      - name: Install Rust toolchain
        working-directory: src
        run: |
          rustup show active-toolchain || rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          rustup target add "$TARGET"
          rustc --version

      - name: Build
        working-directory: src
        run: cargo build --release --target "$TARGET" --package=easytier --features=jemalloc

      - name: Publish binaries
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp "target/$TARGET/release/easytier-core" "target/$TARGET/release/easytier-cli" out/
          ./out/easytier-core --version | tee out/VERSION
          (cd out && sha256sum easytier-core easytier-cli | tee SHA256SUMS)
          TAG="build-${GITHUB_SHA::8}"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$TAG (x86_64-unknown-linux-musl)" \
            --notes "Test build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA}. Not an official release." \
            out/easytier-core out/easytier-cli out/VERSION out/SHA256SUMS
